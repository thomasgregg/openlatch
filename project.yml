name: OpenLatch
options:
  developmentLanguage: en
  bundleIdPrefix: org.openlatch
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '27.0'
packages:
  OpenLatchCore:
    path: .
  TeslaBLE:
    path: Packages/TeslaBLE
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  OpenLatch:
    type: application
    platform: iOS
    sources: [OpenLatch]
    dependencies:
      - package: OpenLatchCore
      - package: TeslaBLE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlatch.app
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    info:
      path: OpenLatch/Info.plist
      properties:
        CFBundleDisplayName: OpenLatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: OpenLatch connects directly to your Tesla to pair a key and release your driver door.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  OpenLatchTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OpenLatchTests]
    dependencies:
      - target: OpenLatch
      - package: OpenLatchCore
      - package: TeslaBLE
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  OpenLatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OpenLatchUITests]
    dependencies:
      - target: OpenLatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenLatch Preview:
    build:
      targets:
        OpenLatch: all
    run:
      config: Debug
      commandLineArguments:
        '-demo': true
  OpenLatch:
    build:
      targets:
        OpenLatch: all
        OpenLatchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [OpenLatchTests, OpenLatchUITests]
